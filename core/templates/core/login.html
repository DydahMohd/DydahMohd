{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Login</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Password</label>
                        <div class="input-group">
                            {{ form.password }}
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordLogin">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="mt-3 mb-0">Need an account? <a href="{% url 'register' %}">Register here</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var passwordInput = document.getElementById('id_password');
        var toggleButton = document.getElementById('togglePasswordLogin');
        if (passwordInput && toggleButton) {
            toggleButton.addEventListener('click', function () {
                var type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleButton.textContent = type === 'password' ? 'Show' : 'Hide';
            });
        }
    });
</script>
{% endblock %}
